[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "0.0.1"
description = "AI-assisted writing, with full observability."
requires-python = ">=3.10"

[project.scripts]
ledger = "ledger.cli:main"

[tool.setuptools]
packages = ["ledger"]
